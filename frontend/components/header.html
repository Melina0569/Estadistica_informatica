<header class="fixed top-0 left-64 right-0 h-16 bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] z-40 flex items-center justify-between px-space-xl border-b border-surface-container-high/40">
  <div class="header-datetime" aria-label="Fecha y hora actual">

    <img
        src="/frontend/assets/icons/Calendario.png"
        alt=""
        class="header-datetime-icon-img"
    >

    <span class="header-datetime-content">
      <span class="header-datetime-label">Hoy</span>
      <span id="header-date" class="header-datetime-date"></span>
    </span>

    <span class="header-datetime-divider" aria-hidden="true"></span>

    <span class="header-datetime-content header-datetime-clock">
      <span class="header-datetime-label">
        <span class="header-live-dot"></span>En vivo
      </span>
      <span id="header-time" class="header-datetime-time"></span>
    </span>

  </div>
</header>
